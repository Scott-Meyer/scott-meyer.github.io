name: Stage Keyglass v1 mirror

on: workflow_dispatch

permissions: {}

concurrency:
  group: github-pages

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy the live v1 update site
        run: bash scripts/snapshot-updater.sh https://scott-meyer.github.io/openflux site/openflux
      - name: Verify the copied update index with the v1 release key
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install minisign
          minisign -Vm site/openflux/index.json -x site/openflux/index.json.sig -p keys/v1-release.pub
      - name: Stage a preview outside the existing project Pages path
        run: |
          cp -R site/openflux site/keyglass-mirror-check
          cp index.html site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.1
        with:
          path: site

  deploy:
    needs: snapshot
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
